<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer Console</title>

<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>

<link rel="preload" href="fonts/PerfectDOSVGA437Win.woff2" as="font" type="font/woff2" crossorigin>

<style>
    @font-face {
        font-family: 'Perfect DOS VGA 437 Win';
        src: url('fonts/PerfectDOSVGA437Win.woff2') format('woff2'),
             url('fonts/PerfectDOSVGA437Win.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    #terminal {
        width: 100%; height: 100%;
        background: #000;
        color: #aaaaaa;
        font-family: 'Perfect DOS VGA 437 Win', monospace;
        font-size: 32px;
        padding: 8px 12px;
        display: flex; flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: none;
        font-smooth: never;
        text-rendering: optimizeSpeed;
    }

    #output {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        white-space: pre-wrap;
        word-break: break-word;
    }
    #output::-webkit-scrollbar { display: none; }

    /* No hardcoded color — inherits from #terminal */
    .line { display: block; line-height: 1; margin-bottom: 6px; }
    .line.bright { color: #ffffff !important; }
    .line.error  { color: #ff5555 !important; }
    .line.warn   { color: #ffff55 !important; }
    .line.dim    { color: #666666 !important; }

    #input-line {
        display: flex; align-items: center;
        line-height: 1; margin-top: 6px; flex-shrink: 0;
    }
    #prompt { white-space: nowrap; }

    #input-field {
        background: transparent; border: none; outline: none;
        color: inherit;
        font-family: 'Perfect DOS VGA 437 Win', monospace;
        font-size: 32px; line-height: 1;
        caret-color: #aaaaaa;
        flex: 1;
    }

    /* DOS Window */
    #dos-container {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 640px; height: 420px;
        border: 4px solid #aaaaaa;
        background: #000;
        display: none;
        z-index: 1000;
        box-shadow: 0 0 60px rgba(170, 170, 170, 0.3);
        flex-direction: column;
    }

    #dos-header {
        background: #aaaaaa;
        color: #000;
        font-family: 'Perfect DOS VGA 437 Win', monospace;
        font-size: 18px;
        padding: 2px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        user-select: none;
    }

    #dos-header span.close-btn {
        cursor: pointer;
        padding: 0 4px;
    }

    #dos-header span.close-btn:hover {
        background: #000;
        color: #aaaaaa;
    }

    #jsdos {
        width: 100%;
        flex: 1;
    }
</style>
</head>
<body>

<div id="terminal">
    <div id="output"></div>
    <div id="input-line">
        <span id="prompt">C:\CHAT&gt;</span>
        <input
            id="input-field"
            type="text"
            autocomplete="off"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            maxlength="200"
            disabled
        />
    </div>
</div>

<!-- JS-DOS Virtual Monitor Window -->
<div id="dos-container">
    <div id="dos-header">
        <span>JS-DOS WASM MONITOR</span>
        <span class="close-btn" onclick="closeDos()">[X] CLOSE</span>
    </div>
    <div id="jsdos"></div>
</div>

<script>
    const output     = document.getElementById('output');
    const inputField = document.getElementById('input-field');
    const promptEl   = document.getElementById('prompt');
    const terminal   = document.getElementById('terminal');
    const dosContainer = document.getElementById('dos-container');

    let cmdHistory = [];
    let histIndex  = -1;
    let socket     = null;
    let dosInstance = null;

    // ===================== TERMINAL OUTPUT =====================
    function printLine(text, cls) {
        const div = document.createElement('div');
        div.className = 'line' + (cls ? ' ' + cls : '');
        div.textContent = text || '\u00A0';
        output.appendChild(div);
        trimLines();
        output.scrollTop = output.scrollHeight;
    }

    function trimLines() {
        const lines = output.querySelectorAll('.line');
        if (lines.length > 300) {
            for (let i = 0; i < lines.length - 300; i++) {
                output.removeChild(lines[i]);
            }
        }
    }

    // ===================== JS-DOS =====================
   function openDos(bundleUrl) {
    console.log("Loading bundle from:", bundleUrl);
    
    const container = document.getElementById('jsdos');
    dosContainer.style.display = 'flex';
    inputField.disabled = true;

    // In v7 'latest', the URL goes INSIDE the options object
    Dos(container, {
        url: bundleUrl,
        wasmFolderPath: "https://js-dos.com/v7/build/releases/latest/", // Ensures WASM workers load
    }).then((ci) => {
        console.log("DOS Instance loaded successfully");
        dosInstance = ci;
    }).catch((err) => {
        console.error("JS-DOS error:", err);
        // If you see a 'fetch' error here, the path /doom.jsdos is still 404
    });
}
    // ===================== WEBSOCKET =====================
    function connectSocket() {
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        socket = new WebSocket(protocol + location.host);

        socket.addEventListener('open', () => {
            inputField.disabled = false;
            inputField.focus();
        });

        socket.addEventListener('message', (event) => {
            let data;
            try { data = JSON.parse(event.data); } catch (e) { return; }

            if (data.type === 'line') {
                printLine(data.text, data.cls);

            } else if (data.type === 'prompt') {
                promptEl.textContent = data.text;
                if (inputField.type === 'password' &&
                    !data.text.toLowerCase().includes('password')) {
                    inputField.type = 'text';
                }

            } else if (data.type === 'clear') {
                output.innerHTML = '';

            } else if (data.type === 'authmode') {
                if (data.enabled) {
                    inputField.type = 'password';
                    promptEl.textContent = 'Password:';
                } else {
                    inputField.type = 'text';
                }

            } else if (data.type === 'color-change') {
                // Change master color — all normal lines inherit from #terminal
                terminal.style.color = data.color;

            } else if (data.type === 'run-dos') {
                openDos(data.bundle);
            }
        });

        socket.addEventListener('close', () => {
            printLine('', '');
            printLine('[SYSTEM] Connection lost. Reconnecting...', 'error');
            inputField.disabled = true;
            setTimeout(connectSocket, 2000);
        });

        socket.addEventListener('error', () => socket.close());
    }

    // ===================== INPUT =====================
    function sendInput(text) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'input', text, ts: Date.now() }));
        }
    }

    inputField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = inputField.value;
            if (val.trim()) {
                if (inputField.type !== 'password') {
                    cmdHistory.unshift(val);
                    histIndex = -1;
                }
                sendInput(val);
            }
            inputField.value = '';
            e.preventDefault();
        }

        if (e.key === 'ArrowUp' && inputField.type !== 'password') {
            if (histIndex < cmdHistory.length - 1) {
                histIndex++;
                inputField.value = cmdHistory[histIndex];
            }
            e.preventDefault();
        }

        if (e.key === 'ArrowDown' && inputField.type !== 'password') {
            if (histIndex > 0) {
                histIndex--;
                inputField.value = cmdHistory[histIndex];
            } else {
                histIndex = -1;
                inputField.value = '';
            }
            e.preventDefault();
        }
    });

    document.addEventListener('click', () => {
        if (dosContainer.style.display !== 'flex') {
            inputField.focus();
        }
    });

    connectSocket();
</script>
</body>
</html>
